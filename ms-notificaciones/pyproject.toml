[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notificaciones"
version = "0.1.0"
description = "Microservicio Notificaciones - Hogar de los Alpes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.25",
    # Driver de PostgreSQL. Su ausencia es lo que rompe la ejecucion con Postgres
    # en el servicio de marketplace, donde nunca se declaro.
    "psycopg2-binary>=2.9.9",
    # El extra [avro] arrastra fastavro. Sin fastavro, pulsar.schema.AvroSchema
    # es un stub inerte y la serializacion Avro falla en tiempo de ejecucion.
    "pulsar-client[avro]>=3.13.0",
    "httpx>=0.27.0",
    # Metricas HTTP (requests OK/fallidos, latencia) expuestas en /metrics.
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cluster: requiere un cluster de Apache Pulsar accesible (se omite si no hay PULSAR_SERVICE_URL)",
    "postgres: requiere una base de datos PostgreSQL accesible (se omite si no hay DATABASE_URL)",
]
