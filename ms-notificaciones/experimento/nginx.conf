# Balanceador de carga del experimento de disponibilidad.
# Ver ../docs/experimento-disponibilidad.md.
#
# "Health check pasivo": Nginx no llama a /health por su cuenta (eso seria
# un chequeo "activo", solo disponible en Nginx Plus). En su lugar, cuenta
# fallos reales de trafico: si una replica falla `max_fails` veces seguidas,
# se le deja de enviar trafico durante `fail_timeout`.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream notificaciones_backend {
        server notificaciones_1:8000 max_fails=2 fail_timeout=10s;
        server notificaciones_2:8000 max_fails=2 fail_timeout=10s;
        server notificaciones_3:8000 max_fails=2 fail_timeout=10s;
    }

    # Header X-Instance-Id: lo pone el propio servicio (ver main.py); solo
    # lo dejamos pasar sin que Nginx lo toque.
    server {
        listen 80;

        location / {
            proxy_pass http://notificaciones_backend;
            proxy_set_header Host $host;

            # Reintentos: si la replica elegida no responde (o responde
            # 502/503/504), Nginx reintenta la MISMA solicitud contra otra
            # replica sana antes de devolver un error al cliente.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
